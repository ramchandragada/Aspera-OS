---
- name: Flameshot autostart for skel
  ansible.builtin.copy:
    dest: /etc/skel/.config/autostart/flameshot.desktop
    content: |
      [Desktop Entry]
      Type=Application
      Name=Flameshot
      Exec=flameshot
      Icon=flameshot
      X-GNOME-Autostart-enabled=true
    mode: "0644"

- name: Ensure skel config dirs
  ansible.builtin.file:
    path: /etc/skel/.config/xfce4/xfconf/xfce-perchannel-xml
    state: directory
    mode: "0755"
